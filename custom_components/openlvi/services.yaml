ask_assistant:
  name: Ask OpenLVI English guide
  description: >-
    Explain the selected controller's settings in English. Uses an optional
    private LAN Ollama model, otherwise deterministic offline guidance.
    Advisory only: never changes any equipment, setpoint or controller mode.
  fields:
    question:
      required: true
      selector:
        text:
          multiline: true
      example: "What does L1 fine adjustment do and what should I check first?"
    config_entry_id:
      required: false
      selector:
        text:
      example: "Only needed when more than one OpenLVI device is configured"
