# Experimental Ouman EH-800B USB-to-Wi-Fi bridge for ESP32-S3.
# This is NOT the native EH-800 parser: it forwards raw USB CDC-ACM bytes
# to a TCP socket and keeps the official HA v0.1.2 sensor decoder on HA.
# USB Host hardware: USB-OTG D- GPIO19, D+ GPIO20; external powered USB hub.
#
# IMPORTANT:
# - The Ouman EH-800B (VID:PID EB03:0920) has NOT yet been tested with
#   this third-party USB host bridge; verify USB enumeration first.
# - Use only the S3's USB/OTG connector for the host, not USB/UART/JTAG.
# - TCP 8880 is not encrypted/authenticated: IP-allowlist it to your HA host.
# - Never port-forward the bridge to the internet.

substitutions:
  device_name: ouman-eh800-s3
  device_friendly_name: Ouman EH800 USB Bridge

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_USB_OTG_SUPPORTED: "y"
      CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE: "1024"
      CONFIG_LWIP_MAX_SOCKETS: "20"

# Pin a reviewed upstream USB Host bridge revision for reproducible builds.
# USB-serial CDC-ACM bridge by ESDN83 (MIT).
external_components:
  - source:
      type: git
      url: https://github.com/ESDN83/esp-ha-usb-gateway
      ref: 2c999927bdba5959aebbdfbc0e179c19564fdf95
    components: [usb_bridge]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# WARNING: USB-Serial-JTAG logs use the same S3 USB PHY as USB Host.
# Route logs to UART0 instead.
logger:
  level: INFO
  hardware_uart: UART0

# Enables HA to show bridge health but not the Ouman 28 sensors by itself.
# Ouman sensors still come from custom_components/ouman_eh800 in HA.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

button:
  - platform: restart
    name: Restart

# This upstream component runs its own configuration page at HTTP port 80.
# Do not add ESPHome web_server: or captive_portal: here.
usb_bridge:
  devices_connected:
    name: Devices Connected
  firmware:
    name: Bridge Firmware
  config_url:
    name: Configuration URL
  ip_address:
    name: IP Address
  devices:
    - device_name:
        name: USB Device Name
      device_port:
        name: TCP Port
      device_status:
        name: USB Status
      device_baud:
        name: Configured Baud
