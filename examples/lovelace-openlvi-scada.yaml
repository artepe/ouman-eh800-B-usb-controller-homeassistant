# Copy www/openlvi-scada-card.js into /config/www/openlvi-scada-card.js.
# Dashboard Resources -> Add JavaScript module /local/openlvi-scada-card.js
# Replace the entity IDs below with actual Home Assistant entities.
type: custom:openlvi-scada-card
entities:
  outdoor: sensor.openlvi_outdoor
  supply: sensor.openlvi_l1_supply
  return: sensor.openlvi_l1_return
  valve: sensor.openlvi_l1_valve
  fan_supply: sensor.openlvi_supply_fan_rpm
  fan_extract: sensor.openlvi_extract_fan_rpm
  power: sensor.openlvi_l1_thermal_power_kw
  delta_t: sensor.openlvi_l1_delta_t
