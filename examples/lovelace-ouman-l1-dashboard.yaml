type: vertical-stack
cards:
  - type: markdown
    content: |
      # 🔥 Ouman EH-800B
      ### L1 heating circuit control room
  - type: grid
    columns: 2
    square: false
    cards:
      - type: gauge
        entity: sensor.ouman_l1_supply_water_temperature
        name: Supply water
        min: 0
        max: 100
        needle: true
      - type: gauge
        entity: sensor.ouman_l1_calculated_supply_target
        name: Supply target
        min: 0
        max: 100
        needle: true
      - type: gauge
        entity: sensor.ouman_l1_valve_position
        name: Valve
        min: 0
        max: 100
        needle: true
      - type: gauge
        entity: sensor.ouman_l1_valve_calculated_position
        name: Valve target
        min: 0
        max: 100
        needle: true
  - type: entities
    title: 🔥 L1 heating curve — SETTINGS
    show_header_toggle: false
    entities:
      - entity: number.ouman_l1_curve_20c
        name: ❄️ -20 °C → supply
      - entity: number.ouman_l1_curve_10c
        name: ❄️ -10 °C → supply
      - entity: number.ouman_l1_curve_0c
        name: 🌡️ 0 °C → supply
      - entity: number.ouman_l1_curve_10c_2
        name: ☀️ +10 °C → supply
      - entity: number.ouman_l1_curve_20c_2
        name: ☀️ +20 °C → supply
  - type: entities
    title: 📊 Ouman live measurements
    show_header_toggle: false
    entities:
      - entity: sensor.ouman_l1_calculated_supply_target
        name: Calculated supply
      - entity: sensor.ouman_l1_supply_water_temperature
        name: Actual supply
      - entity: sensor.ouman_l1_valve_calculated_position
        name: Valve control signal
      - entity: sensor.ouman_l1_valve_position
        name: Valve position
  - type: history-graph
    title: 📈 Supply water — 12 h
    hours_to_show: 12
    entities:
      - entity: sensor.ouman_l1_supply_water_temperature
        name: Supply water
      - entity: sensor.ouman_l1_calculated_supply_target
        name: Target
