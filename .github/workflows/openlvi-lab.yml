name: OpenLVI Lab prototypes

on:
  pull_request:
    paths:
      - 'tools/openlvi_lab/**'
      - 'tools/openlvi_lab_cli.py'
      - 'tools/openlvi_lab_server.py'
      - 'tests/test_openlvi_lab.py'
      - 'tests/test_openlvi_local_first.py'
      - 'tests/test_openlvi_tosibox.py'
      - 'www/openlvi-digital-twin-card.js'
      - 'examples/openlvi-lab/**'
      - 'docs/OPENLVI_LAB.md'
      - 'docs/LOCAL_FIRST_HEATPUMPS.md'
      - 'docs/TOSIBOX_INTEGRATION.md'
      - '.github/workflows/openlvi-lab.yml'
  push:
    branches:
      - main
      - feature/openlvi-full-lab-12-modules-20261104
    paths:
      - 'tools/openlvi_lab/**'
      - 'tools/openlvi_lab_cli.py'
      - 'tools/openlvi_lab_server.py'
      - 'tests/test_openlvi_lab.py'
      - 'tests/test_openlvi_local_first.py'
      - 'tests/test_openlvi_tosibox.py'
      - 'www/openlvi-digital-twin-card.js'
      - 'examples/openlvi-lab/**'
      - '.github/workflows/openlvi-lab.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile pure Python Lab code
        run: python -m compileall -q tools/openlvi_lab tools/openlvi_lab_cli.py tools/openlvi_lab_server.py
      - name: Run all 12-feature regression tests
        run: |
          python -m unittest discover -s tests -p 'test_openlvi_lab.py' -v
          python -m unittest discover -s tests -p 'test_openlvi_local_first.py' -v
          python -m unittest discover -s tests -p 'test_openlvi_tosibox.py' -v
      - name: Validate Digital Twin JavaScript syntax
        run: node --check www/openlvi-digital-twin-card.js
      - name: Smoke-check the command line
        run: |
          python tools/openlvi_lab_cli.py validate-profile --input examples/openlvi-lab/profile-candidate.json
          python tools/openlvi_lab_cli.py ventilation-lab --input examples/openlvi-lab/ventilation.json
          python tools/openlvi_lab_cli.py local-hvac-path --path panasonic_split_esphome
          python tools/openlvi_lab_cli.py local-heatpump-readings --input examples/openlvi-lab/local-heatpump.json
          python tools/openlvi_lab_cli.py zigbee-audit --input examples/openlvi-lab/zigbee-mesh.json
          python tools/openlvi_lab_cli.py tosibox-status --input examples/openlvi-lab/tosibox-snapshot.json
