name: OpenHVAC Bridge checks
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/openhvac/**'
      - 'tests/test_ouman_universal_profiles.py'
      - 'tests/test_openhvac_vendor_profiles.py'
      - 'tests/test_openhvac_usb_controls.py'
      - 'tests/test_openhvac_ai_guide.py'
      - 'tests/test_openhvac_localization.py'
      - 'tests/test_openhvac_register_offsets.py'
      - 'tests/test_openhvac_lorawan_inspector.py'
      - 'tests/test_openhvac_building_extensions.py'
      - 'tests/test_openhvac_r290_calculator.py'
      - 'tests/test_openhvac_robustness.py'
      - 'tools/refrigerant_state_calculator.py'
      - 'custom_components/openhvac/engineering.py'
      - 'blueprints/automation/openhvac/**'
      - 'tools/lorawan_uplink_inspect.py'
      - 'examples/modbus-myvallox-readonly.json'
      - '.github/workflows/openhvac-core.yml'
  pull_request:
    paths:
      - 'custom_components/openhvac/**'
      - 'tests/test_ouman_universal_profiles.py'
      - 'tests/test_openhvac_vendor_profiles.py'
      - 'tests/test_openhvac_usb_controls.py'
      - 'tests/test_openhvac_ai_guide.py'
      - 'tests/test_openhvac_robustness.py'
      - 'tests/test_openhvac_localization.py'
      - 'tests/test_openhvac_register_offsets.py'
      - 'tests/test_openhvac_lorawan_inspector.py'
      - 'tests/test_openhvac_building_extensions.py'
      - 'tests/test_openhvac_r290_calculator.py'
      - 'tools/refrigerant_state_calculator.py'
      - 'custom_components/openhvac/engineering.py'
      - 'blueprints/automation/openhvac/**'
      - 'tools/lorawan_uplink_inspect.py'
      - 'examples/modbus-myvallox-readonly.json'
      - '.github/workflows/openhvac-core.yml'
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile integration files
        run: python -m compileall -q custom_components/openhvac tools/lorawan_uplink_inspect.py
      - name: Test register decoding and write allowlist
        run: |
          python -m unittest discover -s tests -p 'test_*profiles.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_usb_controls.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_ai_guide.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_localization.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_register_offsets.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_lorawan_inspector.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_building_extensions.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_r290_calculator.py' -v
          python -m unittest discover -s tests -p 'test_openhvac_robustness.py' -v
      - name: Validate Modbus client keyword against pinned library
        run: |
          python -m pip install pymodbus==3.13.1
          python - <<'PY'
          import inspect
          from pymodbus.client import AsyncModbusTcpClient
          sig = inspect.signature(AsyncModbusTcpClient.read_holding_registers)
          assert 'device_id' in sig.parameters, str(sig)
          PY
