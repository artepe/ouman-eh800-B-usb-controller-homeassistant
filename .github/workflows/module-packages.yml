name: Open HVAC module packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'modules/**'
      - 'tools/package_modules.py'
      - 'tools/sync_download_branches.py'
      - 'tests/test_module_distribution.py'
      - 'custom_components/**'
      - 'blueprints/**'
      - 'www/**'
      - 'examples/**'
      - 'esp32_s3/**'
      - '.github/workflows/module-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package all modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate code and safe package catalog
        run: |
          python -m compileall -q tools/package_modules.py tools/sync_download_branches.py
          python -m unittest discover -s tests -p 'test_module_distribution.py' -v
          python -m unittest discover -s tests -p 'test_mango_tuya_bundle.py' -v
      - name: Build standalone module ZIP files and SHA256 manifest
        run: |
          python tools/package_modules.py --out dist
          python tools/package_modules.py --out dist --verify
      - uses: actions/upload-artifact@v4
        with:
          name: open-hvac-module-downloads
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/catalog.json
          if-no-files-found: error
          retention-days: 30

  download-branches:
    name: Synchronize small download branches
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish isolated source snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/sync_download_branches.py

  release:
    name: Publish module ZIPs on version tags
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: open-hvac-module-downloads
          path: dist
      - name: Attach every module as a separate GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/open-hvac-*.zip dist/SHA256SUMS.txt dist/catalog.json \
            --title "Open HVAC $GITHUB_REF_NAME" --generate-notes
